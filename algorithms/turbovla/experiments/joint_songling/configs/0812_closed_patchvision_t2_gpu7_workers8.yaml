run_id: turbovla_0812_closed_patchvision_t2_gpu7_workers8
run_root_dir: ${oc.env:RUN_ROOT_DIR}
seed: 42
wandb_entity: null
wandb_project: turbovla_joint_songling
is_debug: false

framework:
  name: TurboVLA
  text:
    bert_path: ${oc.env:BERT_MODEL_PATH}
    max_text_len: 256
    sub_sentence_present: true
    local_files_only: true
    freeze_text_encoder: true
    attn_implementation: flash_attention_2
  vision:
    model_path: ${oc.env:DINOV3_MODEL_PATH}
    image_size: 224
    num_views: 3
    temporal_window_size: 2
    local_files_only: true
    freeze_vision_encoder: true
    gradient_checkpointing: false
    attn_implementation: flash_attention_2
    position_init_std: 0.01
    position_scale_init: 0.01
    dropout: 0.1
  interaction:
    hidden_dim: 256
    nheads: 8
    dim_feedforward: 2048
    enhancer_inner_dim: 1024
    num_layers: 6
    text_dropout: 0.0
    fusion_dropout: 0.0
    fusion_droppath: 0.1
    padding_strategy: zero_fill
    residual_style: pre_norm
    attention_backend: sdpa
    compute_precision: bf16_autocast
  initialization:
    load_pretrained: false
    load_bert: false
    load_text_projection: false
    load_interaction: false
  action:
    action_dim: 14
    state_dim: 20
    horizon: 50
    num_layers: 3
    dropout: 0.1
    num_state_tokens: 2
    state_hidden_dim: 256
    mlp_hidden_dim: 512
    loss_type: l1

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: ${oc.env:JOINT_SONGLING_OVERLAY_ROOT}
    data_mix: joint_songling_0812_closed_endpoint20_t2
    task: Pick up the bread with the right gripper, transfer it to the left gripper, and place it in the bowl.
    action_type: relative_qpos
    state_mode: delta
    state_mode_apply_keys: [left_joints, right_joints]
    action_mode: rel
    action_mode_apply_keys: [left_joints, right_joints]
    image_layout: joint_songling
    sequential_step_sampling: false
    per_device_batch_size: 16
    load_all_data_for_training: false
    obs_image_size: [224, 224]
    video_backend: pyav
    num_workers: 8
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

trainer:
  use_deepspeed: false
  pretrained_checkpoint: null
  max_train_steps: 500000
  num_warmup_steps: 25000
  save_interval: 20000
  eval_interval: 20000
  learning_rate:
    base: 5.0e-05
    text_encoder: 5.0e-05
    vision_encoder: 5.0e-05
    vision_language_interaction: 5.0e-05
    vision_projection: 5.0e-05
    action_head: 5.0e-05
  lr_scheduler_type: cosine
  scheduler_specific_kwargs: {}
  freeze_modules: text_encoder.bert,vision_encoder.backbone
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-10
  save_format: safetensors
  ema_decay: 0.999
  ema_device: cpu
  logging_frequency: 10
