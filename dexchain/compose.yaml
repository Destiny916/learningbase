services:
  dexchain:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-192.168.3.13:5000/dexsdk:ubuntu22.04-cuda12.8.0-h5ffmpeg-v3}
        DEXECHAIN_VERSION: ${DEXECHAIN_VERSION:-0.1.6}
        EMBODICHAIN_VERSION: ${EMBODICHAIN_VERSION:-0.2.4}
        OPEN3DV_INDEX_URL: ${OPEN3DV_INDEX_URL:-http://pyp.open3dv.site:2345/simple/}
        DEXFORCE_INDEX_URL: ${DEXFORCE_INDEX_URL:-http://192.168.3.43:8080/simple/}
    image: ${DEXCHAIN_IMAGE:-dexchain:0.1.6}
    container_name: ${DEXCHAIN_CONTAINER_NAME:-dexchain}
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      NVIDIA_DRIVER_CAPABILITIES: all
    devices:
      - ${NVIDIA_CDI_DEVICE:-nvidia.com/gpu=0}
      - /dev/dri:/dev/dri
    volumes:
      - .:/workspace/dexchain
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /usr/share/nvidia:/usr/share/nvidia:ro
      - /usr/share/vulkan:/usr/share/vulkan:ro
    working_dir: /workspace/dexchain
    command: ["/bin/bash"]
